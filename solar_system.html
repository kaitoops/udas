<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 14px; letter-spacing: 1px;
      pointer-events: none; user-select: none; text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    #controls-hint {
      position: fixed; top: 20px; right: 20px; color: rgba(255,255,255,0.3);
      font-size: 12px; letter-spacing: 1px; pointer-events: none;
      user-select: none; text-align: right; line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="info">✦ SOLAR SYSTEM ✦</div>
  <div id="controls-hint">drag to rotate<br/>scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ─── Setup ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 140);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 20;
controls.maxDistance = 500;
controls.autoRotate = false;
controls.target.set(0, 0, 0);
controls.update();

// ─── Starfield ─────────────────────────────────────────────────────
function createStarfield() {
  const starsGeometry = new THREE.BufferGeometry();
  const starCount = 12000;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  const sizes = new Float32Array(starCount);
  for (let i = 0; i < starCount; i++) {
    const radius = 600 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
    const temp = Math.random();
    if (temp < 0.3) {
      colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.85 + Math.random() * 0.15; colors[i * 3 + 2] = 0.5 + Math.random() * 0.3;
    } else if (temp < 0.6) {
      colors[i * 3] = 0.7 + Math.random() * 0.3; colors[i * 3 + 1] = 0.8 + Math.random() * 0.2; colors[i * 3 + 2] = 1.0;
    } else {
      const v = 0.8 + Math.random() * 0.2; colors[i * 3] = v; colors[i * 3 + 1] = v; colors[i * 3 + 2] = v;
    }
    sizes[i] = 0.5 + Math.random() * 1.5;
  }
  starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const starMaterial = new THREE.PointsMaterial({
    size: 1.2, vertexColors: true, transparent: true, opacity: 0.9,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const stars = new THREE.Points(starsGeometry, starMaterial);
  scene.add(stars);
  return stars;
}
createStarfield();

// ─── Sun ───────────────────────────────────────────────────────────
const sunRadius = 6;
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(sunRadius, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xffcc33 })
);
scene.add(sun);

function createSunGlow(radius, color, opacity) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide });
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), mat);
}
scene.add(createSunGlow(sunRadius * 1.3, 0xffaa33, 0.25));
scene.add(createSunGlow(sunRadius * 1.7, 0xff6600, 0.12));
scene.add(createSunGlow(sunRadius * 2.2, 0xff4400, 0.06));

const sunLight = new THREE.PointLight(0xffeedd, 2.5, 400);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x222244, 0.4));

// Sun glow sprite
(function() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(255,200,80,1)');
  gradient.addColorStop(0.2, 'rgba(255,200,80,0.3)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texture, blending: THREE.AdditiveBlending, depthWrite: false,
    transparent: true, opacity: 0.6 }));
  sprite.scale.set(80, 80, 1);
  sprite.position.set(0, 0, 0);
  scene.add(sprite);
})();

// ─── Planet Data ───────────────────────────────────────────────────
const PLANET_DATA = [
  { name: 'Mercury', radius: 0.8,  color: 0xb0a8a0, orbit: 12, speed: 0.020 },
  { name: 'Venus',   radius: 1.2,  color: 0xe6c87a, orbit: 18, speed: 0.015 },
  { name: 'Earth',   radius: 1.3,  color: 0x4d8bc4, orbit: 25, speed: 0.012 },
  { name: 'Mars',    radius: 1.0,  color: 0xc0714b, orbit: 33, speed: 0.010 },
  { name: 'Jupiter', radius: 3.8,  color: 0xd4a57a, orbit: 45, speed: 0.006 },
  { name: 'Saturn',  radius: 3.2,  color: 0xe1cd9a, orbit: 58, speed: 0.0045, rings: true },
  { name: 'Uranus',  radius: 2.0,  color: 0x82c8d0, orbit: 72, speed: 0.003 },
  { name: 'Neptune', radius: 1.9,  color: 0x3b6eb5, orbit: 86, speed: 0.002 },
];

function createOrbitRing(radius) {
  const segments = 128;
  const positions = new Float32Array((segments + 1) * 3);
  for (let i = 0; i <= segments; i++) {
    const theta = (i / segments) * Math.PI * 2;
    positions[i * 3] = radius * Math.cos(theta);
    positions[i * 3 + 1] = 0;
    positions[i * 3 + 2] = radius * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  return new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x3a4a6a, transparent: true, opacity: 0.35, depthWrite: false }));
}

function createPlanetTexture(data) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Fill entire canvas with base color first (prevents transparent black gaps)
  ctx.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
  ctx.fillRect(0, 0, 512, 256);

  const base = new THREE.Color(data.color);

  const drawRow = (y, r) => {
    ctx.fillStyle = `rgb(${r[0]*255|0},${r[1]*255|0},${r[2]*255|0})`;
    ctx.fillRect(0, y, 512, 1);
  };

  switch (data.name) {
    case 'Mercury':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const band = 0.15 * Math.sin(v * 12 + 0.3 * Math.sin(v * 8));
        const n = band + 0.2 * (Math.sin(v * 37) * 0.5 + Math.sin(v * 53) * 0.3 + Math.random() * 0.1);
        drawRow(y, [base.r + n, base.g + n, base.b + n]);
      }
      for (let i = 0; i < 50; i++) {
        ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*256, 2+Math.random()*8, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0,0,0,${0.08+Math.random()*0.2})`; ctx.fill();
        ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*256, 1+Math.random()*4, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${0.03+Math.random()*0.08})`; ctx.fill();
      }
      break;
    case 'Venus':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        for (let x = 0; x < 512; x += 4) {
          const u = x / 512;
          const noise = Math.sin(u*20+v*8)*0.3 + Math.sin(u*10-v*15)*0.2 + Math.sin(v*30+u*25)*0.1;
          const band = 0.12 * Math.sin(v*8 + noise) + 0.06 * Math.sin(v*15 - u*12);
          const bright = 0.75 + band + 0.1 * Math.sin(u*30+v*10) * 0.5;
          ctx.fillStyle = new THREE.Color(base.r*bright, base.g*bright, base.b*bright).getStyle();
          ctx.fillRect(x, y, 4, 1);
        }
      }
      break;
    case 'Earth':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        for (let x = 0; x < 512; x += 2) {
          const u = x / 512;
          const n1 = Math.sin(u*15+v*8)*0.5 + Math.sin(u*8+v*20)*0.3;
          const n2 = Math.sin(u*12+v*6+2.1)*0.4 + Math.sin(u*25+v*3+1.2)*0.2;
          const land = (n1 + n2 + 0.1) * (v > 0.15 && v < 0.85 ? 1.8 : 0.3);
          const polar = (v < 0.08 || v > 0.92) ? 0.6 : 0;
          const r = Math.max(0, Math.min(1, 0.25 + land * 0.45 + polar));
          const g = Math.max(0, Math.min(1, 0.55 + land * 0.35 + polar));
          const b = Math.max(0, Math.min(1, 0.65 - land * 0.45 + polar));
          ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
          ctx.fillRect(x, y, 2, 1);
        }
      }
      break;
    case 'Mars':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const polar = (v < 0.06 || v > 0.94) ? 0.35 : 0;
        const n = 0.12 * Math.sin(v*14+Math.sin(v*6)*0.8) + 0.08 * Math.sin(v*25+0.5) + Math.random()*0.04;
        const r = Math.min(1, base.r + n + polar);
        const g = Math.max(0, Math.min(1, base.g + n * 0.6 + polar * 1.2));
        const b = Math.max(0, Math.min(1, base.b + n * 0.3 + polar * 1.5));
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(0, y, 512, 1);
      }
      break;
    case 'Jupiter':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const wave = Math.sin(v*22+0.5*Math.sin(v*8)) * 0.5 + 0.5;
        const bands = [
          [0.85,0.7,0.5], [0.7,0.55,0.35], [0.9,0.8,0.65], [0.6,0.45,0.3],
          [0.95,0.85,0.7], [0.5,0.4,0.25], [0.8,0.65,0.5], [0.45,0.35,0.2]
        ];
        const idx = Math.floor(wave * bands.length) % bands.length;
        const c = bands[idx];
        const jitter = 0.03 * Math.sin(v*60+Math.random()*0.5) + 0.02 * Math.random();
        ctx.fillStyle = `rgb(${(c[0]+jitter)*255|0},${(c[1]+jitter)*255|0},${(c[2]+jitter)*255|0})`;
        ctx.fillRect(0, y, 512, 1);
      }
      break;
    case 'Saturn':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const wave = Math.sin(v*18+1.2) * 0.4;
        const bright = 0.7 + wave + 0.05 * Math.sin(v*45) + 0.03 * Math.random();
        const shift = 0.05 * Math.sin(v*30);
        const r = Math.min(1, base.r * bright + shift);
        const g = Math.min(1, base.g * bright);
        const b = Math.min(1, base.b * bright - shift * 0.3);
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(0, y, 512, 1);
      }
      break;
    case 'Uranus':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const band = 0.04 * Math.sin(v*14+0.8*Math.sin(v*5)) + 0.02 * Math.sin(v*30);
        const r = Math.max(0, Math.min(1, base.r + band));
        const g = Math.max(0, Math.min(1, base.g + band));
        const b = Math.max(0, Math.min(1, base.b + band * 0.3));
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(0, y, 512, 1);
      }
      break;
    case 'Neptune':
      for (let y = 0; y < 256; y++) {
        const v = y / 256;
        const n = 0.06 * Math.sin(v*16+Math.sin(v*4)*0.5) + 0.03 * Math.sin(v*35) + 0.02 * (Math.random()-0.5);
        const band = 0.08 * Math.sin(v*22+2.3) * 0.5;
        const bright = 0.75 + n + band;
        const r = base.r * bright;
        const g = Math.min(1, base.g * bright * 1.1);
        const b = Math.min(1, base.b * bright * 1.2);
        ctx.fillStyle = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
        ctx.fillRect(0, y, 512, 1);
      }
      break;
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

function createLabel(text) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.color = '#ffffff';
  div.style.fontFamily = "'Segoe UI', Arial, sans-serif";
  div.style.fontSize = '14px';
  div.style.fontWeight = '600';
  div.style.textShadow = '0 0 12px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.7)';
  div.style.letterSpacing = '1px';
  div.style.padding = '2px 8px';
  div.style.background = 'rgba(0,0,0,0.3)';
  div.style.borderRadius = '4px';
  div.style.backdropFilter = 'blur(2px)';
  div.style.pointerEvents = 'none';
  return new CSS2DObject(div);
}

const planets = [];
PLANET_DATA.forEach((data) => {
  const ring = createOrbitRing(data.orbit);
  scene.add(ring);

  const texture = createPlanetTexture(data);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(data.radius, 48, 48),
    new THREE.MeshStandardMaterial({ map: texture, color: data.color, roughness: 0.6, metalness: 0.1 })
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const startAngle = Math.random() * Math.PI * 2;
  mesh.position.x = data.orbit * Math.cos(startAngle);
  mesh.position.z = data.orbit * Math.sin(startAngle);
  scene.add(mesh);

  const label = createLabel(data.name);
  label.position.set(0, data.radius * 1.7 + 1.2, 0);
  mesh.add(label);

  // Saturn rings
  let ringMesh = null;
  if (data.rings) {
    const ringGeo = new THREE.RingGeometry(data.radius * 1.3, data.radius * 2.2, 64);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0xc8b88a, side: THREE.DoubleSide, transparent: true, opacity: 0.7,
      roughness: 0.7, metalness: 0.1 });
    ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2.8;
    mesh.add(ringMesh);

    const ringGeo2 = new THREE.RingGeometry(data.radius * 1.1, data.radius * 1.3, 64);
    const ringMat2 = new THREE.MeshStandardMaterial({
      color: 0x988a6a, side: THREE.DoubleSide, transparent: true, opacity: 0.3,
      roughness: 0.8, metalness: 0.0 });
    const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat2);
    ringMesh2.rotation.x = Math.PI / 2.8;
    mesh.add(ringMesh2);
  }

  planets.push({ mesh, data, angle: startAngle, ringMesh });
});

// ─── Asteroid Belt ────────────────────────────────────────────────
(function() {
  const count = 2000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 38 + Math.random() * 6;
    const theta = Math.random() * Math.PI * 2;
    const yOffset = (Math.random() - 0.5) * 2.5;
    pos[i * 3] = r * Math.cos(theta);
    pos[i * 3 + 1] = yOffset;
    pos[i * 3 + 2] = r * Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x886644, size: 0.3, transparent: true, opacity: 0.5,
    sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
})();

// ─── Animation ────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  planets.forEach((p) => {
    p.angle += p.data.speed;
    p.mesh.position.x = p.data.orbit * Math.cos(p.angle);
    p.mesh.position.z = p.data.orbit * Math.sin(p.angle);
  });
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

// ─── Resize ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
